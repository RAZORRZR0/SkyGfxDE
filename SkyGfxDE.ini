; SkyGfxDE settings. Place next to SkyGfxDE.asi (Gameface\Binaries\Win64).
; Keep the in-game "Classic Atmosphere" option OFF: it removes the volumetric clouds and swaps in
; Grove Street's own curves; with it on, only the colour filter, grade and shadows apply.
; Every value below can be changed live in the menu (Look tab) and written back with "Save to ini".

[General]
Enabled=1
; 0 = no log (default), 1 = SkyGfxDE.log next to the .asi (or %LOCALAPPDATA%\SkyGfxDE), 2 = verbose.
; Set 1 when reporting a problem.
Log=0

[Keys]
; Ctrl / Shift / Alt + one key (letter, digit, Tab, Space, Enter, Backtick, Backslash, F1-F24 or 0x hex code).
; Defaults need no F-keys, arrows or numpad (60% keyboards). "None" disables a key.
Menu=Ctrl+Shift+M
Toggle=Ctrl+Shift+E
Reload=Ctrl+Shift+R
Freecam=Ctrl+Shift+F
Noclip=Ctrl+Shift+N

[ColourFilter]
; 1 = PS2 colour filter (skygfx ColourFilter_PS2) from the timecyc postfx1/postfx2 colours,
; multiplied onto the game's own colour gain (the brightness option keeps working).
PS2Filter=1
; Used with a timecyc.dat loaded through [Timecyc] File (the filter expects a PS2 timecyc):
; 0 = off, 1 = PS2 strength, up to 2.
Strength=1.0
; Used with the game's own timecyc. Its postfx colours are PC/mobile-style and give a strong orange
; PS2 gain, so it is applied as a tint only (brightness left to the game) at this strength.
GameTimecycStrength=0.35
; With a loaded timecyc: 0 = keep the PS2 filter's brightness change, 1 = keep only its tint.
KeepBrightness=0.5

[Grade]
; Multipliers on the game's own ColorSaturation / ColorContrast (1 = unchanged).
Saturation=1.15
Contrast=1.05

[Atmosphere]
; 1 = Classic Atmosphere's sky, clouds, sun disc and depth fog (DE's Classic setting, applied only to the time-of-day
; and fog actors), plus Classic's weather particles (wind-blown spray in rain storms, sand clouds in sandstorms);
; the lighting, reflections, exposure and post settings stay modern (Classic's would tint the world).
; 0 = DE's modern sky and fog, tuned by GtaFog / Haze / GroundHaze below.
ClassicSky=1
; With ClassicSky=0: 1 = GTA fog, distance fog from the original's timecyc far clip (DE's own GTA fog path), with DE's
; modern sky. Clear up to half the scaled far clip, FogOpacity at the scaled far clip, thicker beyond: hides the
; low-poly LODs. Foggy SF, rain and sandstorm have short far clips in the timecyc and stay foggy, as in the original.
; Fog colour follows the time of day. 0 = DE's modern fog, tuned by Haze.
GtaFog=0
; GTA fog: multiplier on the timecyc far clip. 1.8 = the original PC draw distance slider at maximum.
FogDistance=1.8
; GTA fog: opacity (0..1) reached at the scaled far clip.
FogOpacity=0.5
; With ClassicSky=0 and GtaFog=0 (DE's modern fog): height fog density multiplier (DE's beige haze). 1 = stock, 0 = none.
Haze=0.35
; With ClassicSky=0: DE's extra fixed ground-haze fog layer (density 0.02, not in the original). 1 = stock, 0 = removed.
GroundHaze=0.0

[Colours]
; How far each Unreal colour is moved to the hue of its timecyc colour (0..1). They replace DE's own time-of-day
; overrides (e.g. DE's orange sunset glow that lasts until 23:00). Sky = sky top/bottom and reflections,
; Fog = fog colour (sky bottom, as in the original), Ambient = sky light (DE's main fill light; the timecyc ambient
; is nearly blueless, so 1 turns the whole world orange: keep it low), Sun = sun light (timecyc sun core),
; Clouds = volumetric clouds (timecyc low clouds).
Sky=1.0
Fog=1.0
Ambient=0.25
Sun=0.35
Clouds=0.5
; 1 = sky and fog brightness follow the timecyc (dark sky at night, as in the original; midday keeps DE's
; brightness) and the sun follows the original's day/night hours (day 7-20, fading 6-7 and 20-21).
; 0 = DE's brightness and sun hours, hue only.
Brightness=1.0
; EV added to DE's outdoor exposure at night (fading with the original's 20-21 / 6-7 hours). DE lights the night
; street with its own lights; 0 = DE's; -0.5 (default) slightly darker; -1.8 matches the original's 22:00 Strip brightness; positive = brighter
; nights. (-10..10; every value in the menu can also be typed in the box next to its slider.)
NightExposure=-0.5

[Shadows]
; Darker shadows: the sky light / indirect fill that lights shadowed areas is lowered by
; Darkness x timecyc shadow strength (darkest at midday, softer at night/overcast).
; 0 = stock, max 0.9. Interior post-process volumes are not affected.
Darkness=0.5

[Characters]
; Matte peds: DE's skin, clothes and hair materials are glossy. Roughness is pulled towards fully rough and
; specular is multiplied by (1 - Matte). 0 = stock DE, 1 = no specular at all. Follows the look toggle.
Matte=0.6

[SpeedFX]
; The original's speed blur (CPostEffects::SpeedFX, gta_sa.exe 1.0): from ~108 km/h in any car or bike (not planes,
; helis, boats or trains), 1-5 zoomed copies of the frame at alpha 36; nitro boosts it, looking behind or sideways
; weakens it, off in cutscenes. Follows the look toggle.
Enabled=1
; All post effects (SpeedFX, radiosity, grain, water drops) are drawn just before this backbuffer bind of the frame,
; so the HUD stays sharp. DE binds it 3 times a frame and the HUD is drawn after bind 2 (SkyGfxDE.log logs the count
; once). 0 = draw at Present (HUD included). DX12 (-dx12) counts the same binds and composites the effects under the HUD.
HudBind=2
; 1 = full effect all the time, as the original's m_bSpeedFXTestMode (for checking the look).
TestMode=0

[Radiosity]
; The PS2's glow (CPostEffects::Radiosity): the frame is shrunk to PS2 scale, everything above the timecyc
; "IntensityLimit" column (per hour and weather; lower at night) is doubled, and added back at this alpha out of 255
; (35 = m_RadiosityIntensity).
Enabled=1
Intensity=35
; How far up-left the glow sits from its source, in PS2 pixels (0-12; 6 = the PS2's offset, 0 = centred).
Offset=0.2
; DE's own bloom multiplier while radiosity is on (0 = off, as on the PS2; 1 = DE's bloom as well).
DEBloom=0

[Grain]
; The PS2 rain grain (CPostEffects::Render, skygfx Grain_PS2): fades in with the rain, outside and above water.
Enabled=1
; Grain opacity multiplier (0-2; 1 = PS2, 0 = off).
Strength=1

[WaterDrops]
; skygfx's neo water drops: rain drops on the lens when outside and not looking down, and splashes from water FX
; within 10 m. They slide with the camera's movement and fade out.
Enabled=1
; Most drops on the lens at once (0-2000; skygfx's 2000). Lower = fewer drops in heavy rain and splashes.
MaxDrops=2000

[StreetLights]
; DE's street lamps have real lights, but DE sets gta.streetlightdistance and gta.streetlight.shadowdistance to 4 cm,
; so the lamp lights are culled (no light below them) and cast no shadows. These set both cvars (metres); DE applies
; them to every lamp as it streams in. Light draw distance (fading over its last 20%):
DrawDistance=150
; Lamp shadow distance: lamps closer than this cast dynamic shadows (peds, cars, poles in the light pools). Each one
; renders a shadow map every frame; lower it if the frame rate drops. 0 = DE's (both keys). Follows the look toggle.
ShadowDistance=50
; 1 = every world light casts shadows (within ShadowDistance for lamps): lamps, bollards, porch/window/interior lights,
; signs. Vehicle, pickup and explosion lights are left alone. Lamp meshes stop casting shadows so they don't black out
; their own light up close. 0 = DE's. Follows the look toggle.
OtherLightShadows=1
; Park bollard light intensity multiplier (DE's are very bright next to the lampposts). 1 = DE's.
BollardBrightness=0.5
; SF park globe lamp light multiplier: DE gives them a tenth of a lamppost's light, so no pool of light under them.
; 1 = DE's.
GlobeLampBrightness=8

[Tools]
; Freecam / noclip speeds in metres per second. The look direction follows the game's own mouse camera.
FreecamSpeed=20
NoclipSpeed=15

[Timecyc]
; timecyc.dat loaded instead of the game's. Default: the PS2 one (PS2 data\colorcycle.dat), shipped next to the .asi
; as timecyc_ps2.dat. 8-hour files (23 weathers x 8 lines) or 24-hour files (23 x 24; the hours of the game's 8 slots
; are used: 0,5,6,7,12,19,20,22). Relative paths are next to the .asi. Empty = the game's own timecyc. The PS2 file
; also gives radiosity its PS2 limits.
File=timecyc_ps2.dat

[World]
; Draw/LOD distance multiplier on DE's TheCamera.m_fLODDistMultiplier (DE: 70/FOV). It scales every model's draw
; distance for drawing and streaming, like the PC draw distance slider (1.2 default, 1.8 max; DE itself = 1.0).
; DE caps visibility at about 700 m, so values past ~2.5 change little. Not part of the look toggle.
LodDistance=1.8
