; SkyGfxDE settings. Place next to SkyGfxDE.asi (Gameface\Binaries\Win64).
; Keep the in-game "Classic Atmosphere" option OFF: it removes the volumetric clouds and swaps in
; Grove Street's own curves; with it on, only [ColourFilter] and [Shadows] apply.

[General]
Enabled=1
; Virtual-key code that toggles the whole effect on/off in game (0x79 = F10, 0 = no key).
ToggleKey=0x79
; Virtual-key code that re-reads this file in game, so settings can be tuned live (0x7A = F11, 0 = no key).
ReloadKey=0x7A
; 0 = no log, 1 = SkyGfxDE.log next to the .asi (or %LOCALAPPDATA%\SkyGfxDE), 2 = verbose.
Log=1

[ColourFilter]
; 1 = PS2 colour filter (skygfx ColourFilter_PS2) from the timecyc postfx1/postfx2 colours,
; multiplied onto the game's own colour gain (the brightness option keeps working).
PS2Filter=1
; Used with a timecyc.dat loaded through [Timecyc] File (the filter expects a PS2 timecyc):
; 0 = off, 1 = PS2 strength, up to 2.
Strength=1.0
; Used with the game's own timecyc. Its postfx colours are PC/mobile-style and give a strong orange
; PS2 gain, so it is applied as a tint only (brightness left to the game) at this strength.
GameTimecycStrength=0.35
; With a loaded timecyc: 0 = keep the PS2 filter's brightness change, 1 = keep only its tint.
KeepBrightness=0.5
; Display-space PS2 gain -> Unreal linear colour gain.
Gamma=2.2

[Colours]
; How far each Unreal colour is moved to the hue of its timecyc colour (0..1). Unreal's brightness is kept.
; Sky = sky top/bottom, Fog = fog colour (sky bottom, as in the original), Ambient = sky light / ambient,
; Sun = sun light (timecyc sun core), Clouds = volumetric clouds (timecyc low clouds).
Sky=1.0
Fog=1.0
Ambient=1.0
Sun=0.35
Clouds=0.5

[Shadows]
; Darker shadows: the sky light / indirect fill that lights shadowed areas is lowered by
; Darkness x timecyc shadow strength (so shadows are darkest at midday, softer at night/overcast).
; 0 = stock, max 0.9. Interior post-process volumes are not affected.
Darkness=0.5

[Timecyc]
; Optional timecyc.dat loaded instead of the game's, e.g. the PS2 one. 8-hour files (23 weathers x 8 lines)
; or 24-hour files (23 x 24; the hours of the game's 8 slots are used: 0,5,6,7,12,19,20,22).
; Relative paths are next to the .asi. Empty = the game's own timecyc.
File=
